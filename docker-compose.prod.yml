# Public deployment. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Adds HTTPS (Caddy) and closes the direct ports (5000 / 8080) so only 80/443 are reachable.
services:
  backend:
    ports: !reset []
    environment:
      CLIENT_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env (e.g. hire.example.com)}

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
